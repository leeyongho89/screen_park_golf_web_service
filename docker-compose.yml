services:
  db:
    image: postgres:16-alpine
    container_name: screen-golf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screen_golf}
      POSTGRES_USER: ${POSTGRES_USER:-screen_golf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screen_golf_password}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: screen-golf-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://screen_golf:screen_golf_password@db:5432/screen_golf}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      OPERATOR_NAME: ${OPERATOR_NAME:-관리자}
      NCP_SMS_SERVICE_ID: ${NCP_SMS_SERVICE_ID:-}
      NCP_ACCESS_KEY: ${NCP_ACCESS_KEY:-}
      NCP_SECRET_KEY: ${NCP_SECRET_KEY:-}
      NCP_SMS_FROM_NUMBER: ${NCP_SMS_FROM_NUMBER:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ./uploads:/app/uploads
      - ./db/raw:/app/db/raw:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: screen-golf-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      TZ: ${TZ:-Asia/Seoul}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: screen-golf-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "8080:80"

volumes:
  postgres_data: