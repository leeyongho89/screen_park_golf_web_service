<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">한타 포지셔닝 기본 구조</title>
  <desc id="desc">탱커, 브루저, 딜러, 서포터의 기본 간격과 공격 우선순위를 표현한 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e5e7eb" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <text x="74" y="92" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f9fafb">Basic Teamfight Positioning</text>
  <text x="74" y="128" font-family="Arial, sans-serif" font-size="22" fill="#d1d5db">가까운 적부터 치고, 딜러는 살아남으며 지속 딜을 넣는 구조가 기본이다.</text>
  <g filter="url(#shadow)">
    <circle cx="255" cy="375" r="92" fill="#60a5fa" />
    <circle cx="470" cy="375" r="74" fill="#93c5fd" />
    <circle cx="780" cy="335" r="70" fill="#fca5a5" />
    <circle cx="930" cy="430" r="62" fill="#fcd34d" />
    <circle cx="1070" cy="340" r="70" fill="#fb7185" />
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="218" y="368" font-size="28" font-weight="700">탱커</text>
    <text x="201" y="402" font-size="20">Frontline</text>
    <text x="433" y="368" font-size="24" font-weight="700">브루저</text>
    <text x="425" y="399" font-size="18">Follow</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="747" y="329" font-size="24" font-weight="700">원딜</text>
    <text x="741" y="359" font-size="18">DPS</text>
    <text x="889" y="425" font-size="24" font-weight="700">서폿</text>
    <text x="1032" y="334" font-size="24" font-weight="700">메이지</text>
  </g>
  <path d="M560 375 L700 350" stroke="#e5e7eb" stroke-width="8" marker-end="url(#arrow)" />
  <path d="M560 398 L885 422" stroke="#e5e7eb" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#arrow)" />
  <rect x="92" y="540" width="1090" height="106" rx="24" fill="#f9fafb" opacity="0.94" />
  <text x="130" y="588" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">핵심 원칙</text>
  <text x="130" y="624" font-family="Arial, sans-serif" font-size="22" fill="#374151">앞라인이 시야와 공간을 만들고, 뒷라인은 무리해서 깊게 들어가지 않는다.</text>
</svg>
