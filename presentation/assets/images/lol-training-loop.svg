<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">라인전 훈련 루프</title>
  <desc id="desc">CS 연습, 리플레이 확인, 교정 포인트 반복 과정을 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8f1e5" />
      <stop offset="100%" stop-color="#d8f3dc" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <text x="78" y="110" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1b4332">Training Loop For Improvement</text>
  <text x="78" y="150" font-family="Arial, sans-serif" font-size="22" fill="#344e41">많이 하는 것보다, 한 가지를 고치며 반복하는 편이 빠르다.</text>
  <g filter="url(#shadow)">
    <rect x="110" y="250" width="250" height="160" rx="24" fill="#ffffff" />
    <rect x="515" y="250" width="250" height="160" rx="24" fill="#ffffff" />
    <rect x="920" y="250" width="250" height="160" rx="24" fill="#ffffff" />
  </g>
  <g font-family="Arial, sans-serif">
    <text x="165" y="308" font-size="30" font-weight="700" fill="#081c15">1. CS 연습</text>
    <text x="150" y="350" font-size="22" fill="#2d6a4f">5분 동안 라스트 히트만 집중</text>
    <text x="566" y="308" font-size="30" font-weight="700" fill="#081c15">2. 리플레이 확인</text>
    <text x="552" y="350" font-size="22" fill="#2d6a4f">첫 10분과 첫 데스 장면 검토</text>
    <text x="980" y="308" font-size="30" font-weight="700" fill="#081c15">3. 한 가지 교정</text>
    <text x="968" y="350" font-size="22" fill="#2d6a4f">다음 판 목표를 한 개만 설정</text>
  </g>
  <path d="M360 330 C420 290, 455 290, 515 330" fill="none" stroke="#2d6a4f" stroke-width="8" marker-end="url(#arrow)" />
  <path d="M765 330 C825 290, 860 290, 920 330" fill="none" stroke="#2d6a4f" stroke-width="8" marker-end="url(#arrow)" />
  <path d="M1045 440 C905 600, 365 600, 230 440" fill="none" stroke="#2d6a4f" stroke-width="8" marker-end="url(#arrow)" />
  <circle cx="640" cy="555" r="72" fill="#40916c" opacity="0.92" />
  <text x="592" y="548" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">반복</text>
  <text x="572" y="584" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">Repeat</text>
</svg>
